<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Praktikums-Kompass · Klasse 8</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172c36;background:#f2f6f7}*{box-sizing:border-box}body{margin:0}header{background:#116b66;color:white;padding:22px 16px}header .wrap{max-width:850px;margin:auto}h1{font-size:clamp(24px,4vw,34px);margin:5px 0}h2{font-size:24px;margin:0 0 12px}h3{margin:16px 0 8px}p{line-height:1.55}main{max-width:850px;margin:20px auto;padding:0 12px 40px}.panel{background:white;border:1px solid #d6e2e5;border-radius:16px;padding:clamp(16px,3vw,30px);box-shadow:0 2px 12px #142e3610}.small{color:#526a72;font-size:14px}.progress{height:9px;background:#dbe7e7;border-radius:20px;overflow:hidden;margin:16px 0}.bar{height:100%;background:#168b77;width:12.5%;transition:width .2s}.steps{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}.steps button{padding:9px 11px;border-radius:9px;background:#eef5f4;color:#17463f;border:1px solid #bfd5d2}.steps button.active{background:#116b66;color:white}button{cursor:pointer;border:0;border-radius:10px;background:#116b66;color:white;padding:12px 18px;font-weight:650;font-size:15px;min-height:44px}button.secondary{background:#e6efee;color:#164c48}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e8a52d;outline-offset:2px}.nav{display:flex;justify-content:space-between;margin-top:26px;gap:12px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.choice{display:flex;align-items:center;gap:9px;border:1px solid #c6d6d8;border-radius:10px;padding:12px;min-height:58px;cursor:pointer}.choice:has(input:checked){background:#e1f4ed;border-color:#168b77}.choice input{width:20px;height:20px;accent-color:#116b66}textarea,input[type=text],select{font:inherit;border:1px solid #a9bec3;border-radius:10px;padding:12px;width:100%;margin:6px 0 14px}textarea{min-height:100px;resize:vertical}label.field{display:block;font-weight:650;margin-top:12px}.hint{background:#eaf5f3;padding:13px;border-radius:10px;margin:12px 0}.jobgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.job{border:1px solid #cfdddd;padding:13px;border-radius:12px;background:#fbfdfd}.job strong{display:block;margin:5px 0}.job p{font-size:14px;margin:6px 0}.job button{font-size:13px;padding:8px;min-height:38px}.pill{display:inline-block;background:#e5f3ee;border-radius:20px;padding:5px 10px;font-size:13px;margin:3px}.actions{display:flex;gap:9px;flex-wrap:wrap}.preview{white-space:pre-wrap;background:#fafbfa;border:1px solid #d2dddd;border-radius:10px;padding:16px;line-height:1.6;font-family:Georgia,serif}.warn{background:#fff3d9;border-radius:10px;padding:12px}.success{color:#08664e;font-weight:650}footer{text-align:center;font-size:13px;color:#51646c;margin:22px}details{background:#eef5f4;border-radius:10px;padding:12px;margin:12px 0}summary{cursor:pointer;font-weight:650}a{color:#075e78}#stage{min-height:380px}@media(max-width:500px){.nav button{padding:11px}.panel{padding:15px}}</style></head><body><header><div class="wrap"><div>BERUFSORIENTIERUNG · KLASSE 8</div><h1>🧭 Mein Praktikums-Kompass</h1><div>Entdecken · Nachdenken · Selbst schreiben</div></div></header><main><div class="panel"><div class="small" id="counter"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="steps" id="steps"></div><section id="stage" aria-live="polite"></section><div class="nav"><button class="secondary" id="back">← Zurück</button><button id="next">Weiter →</button></div></div><footer>Keine Anmeldung · Keine Werbung · Eingaben bleiben auf diesem Gerät im geöffneten Tab · Keine Datenübertragung durch diese Webseite</footer></main><script>
'use strict';
const titles=['Meine Interessen','Meine Stärken','Berufe entdecken','Mein Wunschpraktikum','Betriebe finden','Bewerbung verstehen','Selbst schreiben','Dokumente erstellen'];
const interestOpts=['Mit Menschen sprechen','Anderen helfen','Etwas reparieren','Mit Tieren arbeiten','Am Computer arbeiten','Kreativ sein','Draußen arbeiten','Organisieren','Kochen oder backen','Sport und Bewegung'];
const strengthOpts=['Ich bin freundlich','Ich kann gut zuhören','Ich bin zuverlässig','Ich arbeite sorgfältig','Ich bin geduldig','Ich kann gut im Team arbeiten','Ich bin handwerklich geschickt','Ich habe gute Ideen'];
const careers=[['🧸','Erzieher/in','Kinder beim Spielen und Lernen begleiten','Kita oder Hort','Menschen'],['🩺','Pflegefachperson','Menschen pflegen und unterstützen','Krankenhaus oder Pflegeeinrichtung','Menschen'],['🛍️','Verkäufer/in','Kunden beraten und Waren einräumen','Geschäft oder Supermarkt','Menschen'],['✂️','Friseur/in','Haare schneiden und stylen','Friseursalon','Kreativ'],['🚗','Kfz-Mechatroniker/in','Autos prüfen und reparieren','Autowerkstatt','Technik'],['💻','Fachinformatiker/in','Computerprogramme oder IT-Systeme betreuen','IT-Betrieb','Technik'],['⚡','Elektroniker/in','Elektrische Anlagen installieren und prüfen','Elektrobetrieb','Technik'],['🪚','Tischler/in','Gegenstände aus Holz herstellen','Tischlerei','Handwerk'],['🥨','Bäcker/in','Brot und Gebäck herstellen','Bäckerei','Handwerk'],['🍳','Koch/Köchin','Speisen zubereiten','Restaurant oder Großküche','Handwerk'],['🌱','Gärtner/in','Pflanzen pflegen und Grünflächen gestalten','Gärtnerei','Natur'],['🐾','Tiermedizinische/r Fachangestellte/r','Bei der Versorgung von Tieren helfen','Tierarztpraxis','Natur'],['📦','Fachkraft für Lagerlogistik','Waren annehmen und versenden','Lager','Organisation'],['🎨','Mediengestalter/in','Bilder, Texte und Medien gestalten','Medienagentur','Kreativ'],['🏊','Fachangestellte/r für Bäderbetriebe','Badegäste beaufsichtigen','Schwimmbad','Menschen'],['🚜','Land- und Baumaschinenmechatroniker/in','Große Maschinen warten','Werkstatt','Technik'],['🦷','Zahnmedizinische/r Fachangestellte/r','Bei Behandlungen helfen und Termine organisieren','Zahnarztpraxis','Menschen'],['🏨','Hotelfachmann/-frau','Gäste empfangen und betreuen','Hotel','Menschen'],['🌼','Florist/in','Blumensträuße und Dekorationen gestalten','Blumengeschäft','Kreativ'],['🧱','Maurer/in','Mauern und Gebäude bauen','Baustelle','Handwerk']];
let step=0,filter='Alle';const data={interests:[],strengths:[],example:'',job:'',motivation:'',goal:'',workplace:'',search:'',quiz1:'',quiz2:'',intro:'',middle:'',ending:'',school:'',experience:'',skills:'',hobbies:''};
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function textarea(key,placeholder,rows=3){return `<textarea data-field="${key}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(data[key])}</textarea>`}function inp(key,placeholder){return `<input type="text" data-field="${key}" placeholder="${esc(placeholder)}" value="${esc(data[key])}">`}
function checkboxes(opts,key){return `<div class="choices">${opts.map(v=>`<label class="choice"><input type="checkbox" data-array="${key}" value="${esc(v)}" ${data[key].includes(v)?'checked':''}><span>${esc(v)}</span></label>`).join('')}</div>`}
function careerCards(){return `<div class="jobgrid">${careers.filter(c=>filter==='Alle'||c[4]===filter).map(c=>`<div class="job"><div style="font-size:27px">${c[0]}</div><strong>${esc(c[1])}</strong><p>${esc(c[2])}</p><p class="small">Wo? ${esc(c[3])}</p><button class="secondary" data-job="${esc(c[1])}">${data.job===c[1]?'✓ Vorgemerkt':'Merken'}</button></div>`).join('')}</div>`}
function render(){ $('counter').textContent=`Station ${step+1} von 8`; $('bar').style.width=`${(step+1)*12.5}%`; $('steps').innerHTML=titles.map((t,i)=>`<button data-step="${i}" class="${step===i?'active':''}" title="${esc(t)}">${i+1}</button>`).join('');let h=`<h2>${titles[step]}</h2>`;
if(step===0)h+=`<p>Was machst du gerne? Wähle mindestens zwei Dinge. Es gibt keine falschen Antworten.</p>${checkboxes(interestOpts,'interests')}<p class="small">Ausgewählt: ${data.interests.length}</p>`;
if(step===1)h+=`<p>Du hast Stärken – auch wenn dir nicht sofort welche einfallen. Was passt zu dir?</p>${checkboxes(strengthOpts,'strengths')}<label class="field">Erzähle von einer echten Situation, in der du eine Stärke gezeigt hast.</label>${textarea('example','Zum Beispiel: Ich habe meiner Freundin bei ...')}<details><summary>💡 Ich brauche Hilfe</summary><p>Denke an Schule, Familie, Sport oder Freunde. Was hast DU gemacht? Beginne mit: „Ich kann gut ... Das habe ich gezeigt, als ...“</p></details>`;
if(step===2)h+=`<p>Es gibt viele Berufe. Hier lernst du 20 Beispiele kennen. Lies, was man dort macht. Merke dir einen interessanten Beruf.</p><div class="actions">${['Alle','Menschen','Technik','Handwerk','Natur','Kreativ','Organisation'].map(f=>`<button class="${filter===f?'':'secondary'}" data-filter="${f}">${f}</button>`).join('')}</div><p class="small">Dein vorgemerkter Beruf: <strong>${esc(data.job||'noch keiner')}</strong></p>${careerCards()}<p class="small">Berufe sind vielfältig. Die Tätigkeiten sind vereinfacht. Im Praktikum dürfen Schülerinnen und Schüler nicht alle Tätigkeiten selbst ausführen.</p>`;
if(step===3)h+=`<p>Du hast <strong>${esc(data.job||'noch keinen Beruf')}</strong> vorgemerkt. Du darfst deine Meinung ändern.</p><label class="field">Welchen Beruf möchtest du kennenlernen?</label><select data-field="job"><option value="">Bitte auswählen</option>${careers.map(c=>`<option value="${esc(c[1])}" ${data.job===c[1]?'selected':''}>${esc(c[1])}</option>`).join('')}</select><label class="field">Warum interessiert dich dieser Beruf?</label>${textarea('motivation','Schreibe deine eigenen Gründe ...')}<label class="field">Was möchtest du im Praktikum lernen?</label>${textarea('goal','Ich möchte herausfinden, wie ...')}<details><summary>💡 Satzanfänge anzeigen</summary><p>„Ich interessiere mich dafür, weil ...“</p><p>„Besonders spannend finde ich ...“</p><p>„Ich möchte lernen, wie ...“</p></details>`;
if(step===4)h+=`<p>Ein Beruf ist noch kein Praktikumsplatz. Jetzt überlegst du, wo du diesen Beruf kennenlernen kannst.</p><div class="hint"><strong>Dein Suchauftrag</strong><ol><li>Suche einen Betrieb in deiner Umgebung.</li><li>Schau auf seiner Webseite nach, was dort gemacht wird.</li><li>Prüfe, ob Schülerpraktika angeboten werden. Falls nicht: freundlich nachfragen.</li></ol></div><p>Suchbegriff zum Kopieren: <strong>${esc(data.job||'Schülerpraktikum')} Praktikum [dein Ort]</strong></p><button class="secondary" id="copysearch">Suchbegriff kopieren</button><p><a href="https://www.arbeitsagentur.de/bildung/praktikum" target="_blank" rel="noopener noreferrer">Informationen zur Praktikumssuche (Bundesagentur für Arbeit) ↗</a></p><label class="field">Welcher Betrieb kommt infrage?</label>${inp('workplace','Name oder Art des Betriebs')}<label class="field">Wie willst du herausfinden, ob dort ein Praktikum möglich ist?</label><select data-field="search"><option value="">Bitte auswählen</option>${['Webseite des Betriebs prüfen','Beim Betrieb nachfragen','Lehrkraft um Hilfe bitten'].map(x=>`<option ${data.search===x?'selected':''}>${x}</option>`).join('')}</select><div class="warn">Wichtig: Ein Betrieb ist erst dann dein Praktikumsplatz, wenn du eine Zusage erhalten hast.</div>`;
if(step===5)h+=`<p>Eine gute Bewerbung erklärt, <strong>warum</strong> du dich bewirbst und <strong>was du mitbringst</strong>.</p><h3>Aufgabe 1: Welcher Satz ist besser?</h3>${radio('quiz1',[['a','Ich muss halt irgendwo Praktikum machen.'],['b','Ich interessiere mich für Ihre Werkstatt und möchte dort ein Praktikum machen.']])}<h3>Aufgabe 2: Was gehört in den Hauptteil?</h3>${radio('quiz2',[['a','Meine Stärken mit Beispielen und mein Interesse.'],['b','Nur mein Name und meine Adresse.']])}<div class="hint"><strong>Aufbau eines Anschreibens</strong><p>1. Einleitung: Warum bewerbe ich mich?</p><p>2. Hauptteil: Was kann ich? Was möchte ich lernen?</p><p>3. Schluss: Wie verabschiede ich mich freundlich?</p></div><p class="small">${data.quiz1==='b'&&data.quiz2==='a'?'✓ Beide Antworten sind richtig!':'Tipp: Wähle die Antworten aus. Du bekommst sofort Rückmeldung.'}</p>`;
if(step===6)h+=`<p>Jetzt schreibst <strong>du selbst</strong>! Deine Ideen aus den vorherigen Stationen helfen dir. Kopiere keine fremde Musterbewerbung.</p><div class="hint"><strong>Deine Notizen:</strong><p>Beruf: ${esc(data.job||'–')} · Betrieb: ${esc(data.workplace||'–')}</p><p>Stärken: ${esc(data.strengths.join(', ')||'–')}</p><p>Beispiel: ${esc(data.example||'–')}</p><p>Interesse: ${esc(data.motivation||'–')}</p><p>Lernziel: ${esc(data.goal||'–')}</p></div><label class="field">1. Einleitung – Warum möchtest du dieses Praktikum?</label>${textarea('intro','Ich bewerbe mich ...',4)}<label class="field">2. Hauptteil – Was kannst du gut? Nenne ein echtes Beispiel.</label>${textarea('middle','Eine meiner Stärken ist ...',6)}<label class="field">3. Schluss – Wie beendest du deine Bewerbung höflich?</label>${textarea('ending','Ich freue mich ...',3)}<details><summary>💡 Satzanfänge – nur wenn du sie brauchst</summary><p>„Ich möchte mein Schülerpraktikum bei Ihnen machen, weil ...“</p><p>„Eine meiner Stärken ist ... Das habe ich gezeigt, als ...“</p><p>„Über eine Rückmeldung würde ich mich freuen.“</p></details>`;
if(step===7)h+=`<p>Fast geschafft! Erstelle jetzt deinen Lebenslauf. <strong>Deinen Namen, deine Adresse und andere persönliche Angaben trägst du erst nach dem Download in Pages oder Word ein.</strong></p><label class="field">Schule und Klassenstufe (ohne deinen Namen)</label>${inp('school','z. B. 8. Klasse, Oberschule')}<label class="field">Erfahrungen (z. B. Projekte, Mithilfe, Verein)</label>${textarea('experience','Was hast du schon gemacht?',2)}<label class="field">Kenntnisse und Stärken</label>${textarea('skills','Was kannst du gut?',2)}<label class="field">Interessen und Hobbys</label>${textarea('hobbies','Was machst du gerne?',2)}<h3>Prüfe dein Anschreiben</h3>${['Ich erkläre, warum ich das Praktikum möchte.','Ich nenne eine Stärke und ein echtes Beispiel.','Ich habe eigene Sätze geschrieben.','Ich habe auf Rechtschreibung geachtet.','Mein Schluss ist freundlich.'].map(t=>`<label class="choice"><input type="checkbox"><span>${t}</span></label>`).join('')}<details><summary>Mein Anschreiben ansehen</summary><div class="preview">${esc(letter())}</div></details><h3>Meine Dokumente herunterladen</h3><p class="small">Die Word-Dateien enthalten deine Texte und Platzhalter für persönliche Daten. Sie werden direkt auf deinem Gerät erzeugt.</p><div class="actions"><button id="dl-letter">📄 Anschreiben (.docx)</button><button id="dl-cv">📄 Lebenslauf (.docx)</button><button id="dl-reflection" class="secondary">🧭 Mein Lernblatt (.docx)</button></div><p class="warn">Öffne die Dateien in Pages oder Word. Ergänze dort die persönlichen Daten. Speichere die Dateien in der Dateien-App. Auf gemeinsam genutzten iPads achte darauf, dass andere deine Daten nicht sehen.</p>`;
$('stage').innerHTML=h;$('back').disabled=step===0;$('next').textContent=step===7?'Zum Anfang ↺':'Weiter →';$('next').disabled=step!==7&&!valid();bind();}
function radio(key,opts){return opts.map(([v,t])=>`<label class="choice"><input type="radio" name="${key}" data-field="${key}" value="${v}" ${data[key]===v?'checked':''}><span>${esc(t)}</span></label>`).join('')+ (data[key]?`<p class="${(key==='quiz1'?data[key]==='b':data[key]==='a')?'success':'small'}">${(key==='quiz1'?data[key]==='b':data[key]==='a')?'✓ Richtig!':'Versuche es noch einmal.'}</p>`:'')}
function valid(){return [data.interests.length>=2,data.strengths.length>=1&&data.example.trim().length>=8,true,!!data.job&&data.motivation.trim().length>=8,!!data.workplace.trim()&&!!data.search,data.quiz1==='b'&&data.quiz2==='a',data.intro.trim().length>=20&&data.middle.trim().length>=20&&data.ending.trim().length>=10,true][step]}
function bind(){document.querySelectorAll('[data-field]').forEach(el=>{const evt=el.tagName==='SELECT'||el.type==='radio'?'change':'input';el.addEventListener(evt,()=>{data[el.dataset.field]=el.value; if(el.type==='radio')render();else $('next').disabled=step!==7&&!valid()})});document.querySelectorAll('[data-array]').forEach(el=>el.addEventListener('change',()=>{const a=data[el.dataset.array];if(el.checked&&!a.includes(el.value))a.push(el.value);if(!el.checked)data[el.dataset.array]=a.filter(x=>x!==el.value);$('next').disabled=!valid()}));document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>{step=+el.dataset.step;render()}));document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{filter=el.dataset.filter;render()}));document.querySelectorAll('[data-job]').forEach(el=>el.addEventListener('click',()=>{data.job=el.dataset.job;render()}));if($('copysearch'))$('copysearch').onclick=()=>navigator.clipboard?.writeText(`${data.job||'Schülerpraktikum'} Praktikum `).then(()=>alert('Suchbegriff kopiert. Ergänze deinen Ort.')).catch(()=>alert('Markiere und kopiere den Suchbegriff oben.'));if($('dl-letter'))$('dl-letter').onclick=()=>downloadDocx('Mein_Bewerbungsanschreiben.docx',letter());if($('dl-cv'))$('dl-cv').onclick=()=>downloadDocx('Mein_Lebenslauf.docx',cvText());if($('dl-reflection'))$('dl-reflection').onclick=()=>downloadDocx('Mein_Lernblatt.docx',reflection());}
$('back').onclick=()=>{if(step>0){step--;render();window.scrollTo(0,0)}};$('next').onclick=()=>{if(step===7){step=0;render();window.scrollTo(0,0);return}if(valid()){step++;render();window.scrollTo(0,0)}else alert('Bitte bearbeite erst die Aufgabe. Du kannst die Hilfen nutzen.')};
function letter(){return `[Dein Vorname und Nachname]\n[Deine Straße und Hausnummer]\n[PLZ und Ort]\n\n${data.workplace||'[Name des Betriebs]'}\n[Anschrift des Betriebs]\n\n[Ort, Datum]\n\nBewerbung um ein Schülerpraktikum\n\nSehr geehrte Damen und Herren,\n\n${data.intro||'[Hier steht deine Einleitung.]'}\n\n${data.middle||'[Hier steht dein Hauptteil.]'}\n\n${data.ending||'[Hier steht dein Schluss.]'}\n\nMit freundlichen Grüßen\n\n[Dein Vorname und Nachname]`}
function cvText(){return `LEBENSLAUF\n\nPERSÖNLICHE DATEN\nName: [Vorname Nachname]\nAdresse: [Straße, PLZ, Ort]\nKontakt: [nur falls erforderlich und mit Erwachsenen abgesprochen]\n\nSCHULBILDUNG\n${data.school||'[Schule und Klassenstufe]'}\n\nPRAKTISCHE ERFAHRUNGEN\n${data.experience||'[Projekte, Verein oder Mithilfe – falls vorhanden]'}\n\nKENNTNISSE UND STÄRKEN\n${data.skills||data.strengths.join(', ')||'[Deine Stärken]'}\n\nINTERESSEN UND HOBBYS\n${data.hobbies||'[Deine Interessen]'}\n\n[Ort, Datum]`}
function reflection(){return `MEIN PRAKTIKUMS-KOMPASS – MEIN LERNBLATT\n\nMEINE INTERESSEN\n${data.interests.join(', ')}\n\nMEINE STÄRKEN\n${data.strengths.join(', ')}\n\nEIN ECHTES BEISPIEL\n${data.example}\n\nMEIN WUNSCHBERUF\n${data.job}\n\nWARUM MICH DIESER BERUF INTERESSIERT\n${data.motivation}\n\nDAS MÖCHTE ICH LERNEN\n${data.goal}\n\nMÖGLICHER BETRIEB\n${data.workplace}\n\nMEIN NÄCHSTER SCHRITT\n${data.search}`}
// Self-contained DOCX generation: ZIP (stored entries), CRC32, OOXML, no external libraries or server.
const encoder=new TextEncoder();function xml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}function u16(n){return [n&255,(n>>>8)&255]}function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}const crcTable=Array.from({length:256},(_,i)=>{let c=i;for(let j=0;j<8;j++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0});function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}function zip(files){let local=[],central=[],offset=0;for(const [name,content] of files){const n=encoder.encode(name),b=encoder.encode(content),crc=crc32(b);const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(b.length),...u32(b.length),...u16(n.length),...u16(0),...n]);local.push(lh,b);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(b.length),...u32(b.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...n]));offset+=lh.length+b.length}const cs=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(offset),...u16(0)]);return new Blob([...local,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
